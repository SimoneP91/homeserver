name: Auto PR

# On every push to a feature/* branch, open a pull request towards sviluppo,
# unless one is already open: the branch → sviluppo → main flow.
on:
  push:
    branches: ["feature/**"]

# The token of this run can only read the code and write pull requests.
permissions:
  contents: read
  pull-requests: write

jobs:
  open-pr:
    name: Open a pull request to sviluppo
    runs-on: ubuntu-latest
    if: ${{ !github.event.deleted }}
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      BRANCH: ${{ github.ref_name }}
      HEAD_MESSAGE: ${{ github.event.head_commit.message }}
    steps:
      - name: Open the pull request if there is none
        run: |
          open=$(gh pr list --head "$BRANCH" --base sviluppo --state open --json number --jq 'length')
          if [ "$open" -gt 0 ]; then
            echo "A pull request from $BRANCH to sviluppo is already open: the push just updated it."
            exit 0
          fi
          ahead=$(gh api "repos/$GH_REPO/compare/sviluppo...$BRANCH" --jq '.ahead_by')
          if [ "$ahead" -eq 0 ]; then
            echo "$BRANCH has no commits that sviluppo does not already have: nothing to propose."
            exit 0
          fi
          title=$(printf '%s\n' "$HEAD_MESSAGE" | head -n 1)
          gh pr create --head "$BRANCH" --base sviluppo --title "$title" \
            --body "Aperta automaticamente dal push di \`$BRANCH\`."
